<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Personale Sincronizzata</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Google Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase Compat SDKs (v10.8.0) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bs-body-bg: #f8fafc;
            --bs-body-color: #0f172a;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            -webkit-font-smoothing: antialiased;
        }

        /* Card personalizzate */
        .card-custom {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
        }

        /* Pulsanti d'azione custom */
        .btn-custom-dark {
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            transition: all 0.15s ease;
        }
        .btn-custom-dark:hover {
            background-color: #1e293b;
            color: #ffffff;
        }

        /* GRIGLIA CALENDARIO */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .calendar-day-header {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            padding: 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .calendar-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            background-color: #ffffff;
            border: 1px solid #f1f5f9;
            color: #334155;
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        .calendar-cell:hover:not(.other-month) {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* Giorno fuori dal mese corrente */
        .calendar-cell.other-month {
            color: #cbd5e1;
            background-color: #f8fafc;
            border-color: transparent;
            cursor: default;
        }

        /* Giorno Oggi */
        .calendar-cell.is-today {
            border: 2px solid #3b82f6;
            color: #3b82f6;
            font-weight: 700;
        }

        /* Giorno Selezionato */
        .calendar-cell.selected {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border-color: #2563eb !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* Giorno Contrassegnato Nick */
        .calendar-cell.nick-day {
            background-color: #fffbeb;
            color: #b45309;
            border-color: #fde68a;
        }

        .calendar-cell.selected.nick-day {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border-color: #2563eb !important;
        }

        /* Indicatore eventi */
        .event-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #3b82f6;
            position: absolute;
            bottom: 4px;
        }
        .calendar-cell.selected .event-dot {
            background-color: #ffffff;
        }
        .calendar-cell.nick-day:not(.selected) .event-dot {
            background-color: #d97706;
        }

        /* Box Nick Moderno */
        .nick-box {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
        }

        .form-switch .form-check-input {
            width: 2.5em;
            height: 1.25em;
            cursor: pointer;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        /* Scrollbar Personalizzata */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Regole Stampa */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body>

    <div class="container py-4 py-md-5" style="max-width: 1140px;">
        
        <!-- HEADER PRINCIPALE -->
        <header class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4 p-4 card-custom no-print">
            <div>
                <h1 class="h4 fw-bold text-dark mb-1 d-flex align-items-center gap-2">
                    <span>📅</span> Agenda Personale
                </h1>
                <p class="text-muted small mb-0">Gestione impegni e organizzazione quotidiana sincronizzata</p>
            </div>
            <div class="d-flex flex-wrap gap-2 w-100 w-md-auto">
                <button onclick="scaricaFileApp()" class="btn btn-outline-dark btn-sm px-3 py-2 rounded-3 fw-semibold d-flex align-items-center gap-2">
                    <span>💾</span> Scarica App
                </button>
                <button onclick="stampaSettimana()" class="btn btn-outline-primary btn-sm px-3 py-2 rounded-3 fw-semibold d-flex align-items-center gap-2">
                    <span>🖨️</span> Stampa Settimana
                </button>
                <button onclick="stampaMese()" class="btn btn-primary btn-sm px-3 py-2 rounded-3 fw-semibold d-flex align-items-center gap-2">
                    <span>🖨️</span> Stampa Mese
                </button>
            </div>
        </header>

        <div class="row g-4">
            
            <!-- COLONNA SINISTRA (CALENDARIO, NICK, FORM) -->
            <div class="col-lg-5 col-xl-4 no-print">
                
                <!-- 1. CALENDARIO MENSILE -->
                <div class="card-custom p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-3 px-1">
                        <button onclick="cambiaMese(-1)" class="btn btn-light btn-sm fw-bold border-0 px-2.5 py-1 text-secondary rounded-2">&larr;</button>
                        <h2 id="meseAnnoLabel" class="h6 fw-bold text-dark text-center mb-0 text-capitalize">Caricamento...</h2>
                        <button onclick="cambiaMese(1)" class="btn btn-light btn-sm fw-bold border-0 px-2.5 py-1 text-secondary rounded-2">&rarr;</button>
                    </div>
                    
                    <!-- Intestazione Giorni Settimana -->
                    <div class="calendar-grid mb-1">
                        <div class="calendar-day-header">Lu</div>
                        <div class="calendar-day-header">Ma</div>
                        <div class="calendar-day-header">Me</div>
                        <div class="calendar-day-header">Gi</div>
                        <div class="calendar-day-header">Ve</div>
                        <div class="calendar-day-header">Sa</div>
                        <div class="calendar-day-header">Do</div>
                    </div>

                    <!-- Griglia Giorni -->
                    <div id="grigliaGiorni" class="calendar-grid"></div>
                </div>

                <!-- 2. CHECKBOX NICK -->
                <div class="nick-box mb-3 d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-2">
                        <span class="fs-5">🌟</span>
                        <label class="form-check-label fw-bold small mb-0 cursor-pointer" for="checkNickGiorno" style="color: #92400e;">
                            Giorno Nick
                        </label>
                    </div>
                    <div class="form-check form-switch m-0 p-0 d-flex align-items-center">
                        <input class="form-check-input ms-0 cursor-pointer" type="checkbox" role="switch" id="checkNickGiorno" onchange="toggleNickSelezionato()">
                    </div>
                </div>

                <!-- 3. FORM AGGIUNGI / MODIFICA -->
                <div class="card-custom p-3.5 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 id="formTitoloSezione" class="h6 fw-bold text-dark mb-0">✏️ Aggiungi Impegno</h3>
                        <button id="btnAnnullaModifica" onclick="annullaModifica()" class="btn btn-link text-danger p-0 small fw-bold text-decoration-none d-none">✕ Annulla</button>
                    </div>

                    <form id="formImpegno" onsubmit="salvaImpegno(event)" class="vstack gap-3">
                        <input type="hidden" id="inputIdModifica">
                        
                        <div>
                            <label class="form-label text-muted extra-small fw-bold text-uppercase mb-1" style="font-size: 0.7rem;">Data</label>
                            <input type="date" id="inputData" onchange="sincronizzaDataSelezionata(this.value)" required class="form-control form-control-sm rounded-2">
                        </div>

                        <div>
                            <label class="form-label text-muted extra-small fw-bold text-uppercase mb-1" style="font-size: 0.7rem;">Titolo Attività</label>
                            <input type="text" id="inputTitolo" placeholder="Es. Riunione, Visita medica..." required class="form-control form-control-sm rounded-2">
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label text-muted extra-small fw-bold text-uppercase mb-1" style="font-size: 0.7rem;">Ora (Opzionale)</label>
                                <input type="time" id="inputOra" class="form-control form-control-sm rounded-2">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted extra-small fw-bold text-uppercase mb-1" style="font-size: 0.7rem;">Categoria</label>
                                <select id="inputCategoria" class="form-select form-select-sm rounded-2">
                                    <option value="Lavoro">💼 Lavoro</option>
                                    <option value="Volontariato">🤝 Volontariato</option>
                                    <option value="Personale">🏠 Personale</option>
                                    <option value="Altro">📌 Altro</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="form-label text-muted extra-small fw-bold text-uppercase mb-1" style="font-size: 0.7rem;">Note (Opzionale)</label>
                            <textarea id="inputNote" rows="2" placeholder="Dettagli aggiuntivi..." class="form-control form-control-sm rounded-2"></textarea>
                        </div>

                        <button type="submit" id="btnSubmitForm" class="btn btn-custom-dark btn-sm py-2 rounded-2 fw-semibold w-100">Salva Impegno</button>
                    </form>
                </div>

            </div>

            <!-- COLONNA DESTRAMENTA (LISTA IMPEGNI DEL GIORNO) -->
            <div class="col-lg-7 col-xl-8">
                <div class="card-custom p-4 h-100 d-flex flex-column">
                    
                    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2 mb-4 pb-3 border-bottom">
                        <div>
                            <h3 id="titoloListaGiorno" class="h5 fw-bold text-dark mb-1">Impegni del Giorno</h3>
                            <p id="sottotitoloGiorno" class="text-muted small mb-0">Seleziona una data dal calendario</p>
                        </div>
                        <span id="badgeConteggio" class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill small fw-semibold">
                            0 impegni
                        </span>
                    </div>

                    <!-- Lista Task Container -->
                    <div id="listaImpegniContainer" class="vstack gap-2.5 overflow-y-auto flex-grow-1" style="max-height: 650px;"></div>

                </div>
            </div>

        </div>

    </div>

    <script>
        // Configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCKdlWXy3nSLSMmNvRDC0DLSeYUtvD-zw8",
            authDomain: "agenda-personale-2f19b.firebaseapp.com",
            projectId: "agenda-personale-2f19b",
            storageBucket: "agenda-personale-2f19b.firebasestorage.app",
            messagingSenderId: "244864247710",
            appId: "1:244864247710:web:39bf720940c3fcadc4d88f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Stato Applicazione
        let dataCorrente = new Date();
        let giornoSelezionato = formattaDataISO(new Date());
        let impegni = [];
        let giorniNick = {};

        // Stili Categorie
        const classiCategorie = {
            'Lavoro': 'bg-primary-subtle text-primary border-primary-subtle',
            'Volontariato': 'bg-success-subtle text-success border-success-subtle',
            'Personale': 'bg-purple-subtle text-dark border-secondary-subtle',
            'Altro': 'bg-light text-dark border-secondary-subtle'
        };

        function formattaDataISO(d) {
            let anno = d.getFullYear();
            let mese = String(d.getMonth() + 1).padStart(2, '0');
            let giorno = String(d.getDate()).padStart(2, '0');
            return `${anno}-${mese}-${giorno}`;
        }

        function formattaDataIt(dataStr) {
            if (!dataStr) return '';
            const [anno, mese, giorno] = dataStr.split('-');
            return `${giorno}/${mese}/${anno}`;
        }

        // Ascoltatore Sincronizzato Firestore Realtime (Impegni)
        db.collection("impegni").onSnapshot((snapshot) => {
            impegni = [];
            snapshot.forEach((doc) => {
                impegni.push({ id: doc.id, ...doc.data() });
            });
            renderizzaCalendario();
            mostraImpegniGiorno(giornoSelezionato);
        }, (err) => console.error("Errore sincro impegni:", err));

        // Ascoltatore Sincronizzato Firestore Realtime (Giorni Nick)
        db.collection("giorni_nick").onSnapshot((snapshot) => {
            giorniNick = {};
            snapshot.forEach((doc) => {
                giorniNick[doc.id] = doc.data().attivo;
            });
            document.getElementById('checkNickGiorno').checked = !!giorniNick[giornoSelezionato];
            renderizzaCalendario();
            mostraImpegniGiorno(giornoSelezionato);
        }, (err) => console.error("Errore sincro giorni Nick:", err));

        function sincronizzaDataSelezionata(dataStr) {
            giornoSelezionato = dataStr;
            const [a, m, g] = dataStr.split('-');
            dataCorrente = new Date(parseInt(a), parseInt(m) - 1, 1);
            
            document.getElementById('checkNickGiorno').checked = !!giorniNick[giornoSelezionato];
            renderizzaCalendario();
            mostraImpegniGiorno(giornoSelezionato);
        }

        async function toggleNickSelezionato() {
            const isChecked = document.getElementById('checkNickGiorno').checked;
            try {
                if (isChecked) {
                    await db.collection("giorni_nick").doc(giornoSelezionato).set({ attivo: true });
                } else {
                    await db.collection("giorni_nick").doc(giornoSelezionato).delete();
                }
            } catch (e) {
                console.error("Errore salvataggio stato Nick:", e);
            }
        }

        function cambiaMese(delta) {
            dataCorrente.setMonth(dataCorrente.getMonth() + delta);
            renderizzaCalendario();
        }

        function renderizzaCalendario() {
            const anno = dataCorrente.getFullYear();
            const mese = dataCorrente.getMonth();
            const oggiStr = formattaDataISO(new Date());

            const nomiMesi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
            document.getElementById('meseAnnoLabel').innerText = `${nomiMesi[mese]} ${anno}`;

            const primoGiornoMese = new Date(anno, mese, 1);
            let giornoInizio = primoGiornoMese.getDay() - 1; // Lunedì = 0
            if (giornoInizio === -1) giornoInizio = 6; // Domenica

            const ultimoGiornoMese = new Date(anno, mese + 1, 0).getDate();
            const ultimoGiornoMesePrec = new Date(anno, mese, 0).getDate();

            const griglia = document.getElementById('grigliaGiorni');
            griglia.innerHTML = '';

            // 1. Giorni Mese Precedente
            for (let i = giornoInizio - 1; i >= 0; i--) {
                const giornoNum = ultimoGiornoMesePrec - i;
                const cella = document.createElement('div');
                cella.className = 'calendar-cell other-month';
                cella.innerText = giornoNum;
                griglia.appendChild(cella);
            }

            // 2. Giorni Mese Corrente
            for (let giorno = 1; giorno <= ultimoGiornoMese; giorno++) {
                const dataString = formattaDataISO(new Date(anno, mese, giorno));
                const cella = document.createElement('div');
                
                const isOggi = (dataString === oggiStr);
                const isSelezionato = (dataString === giornoSelezionato);
                const isNick = !!giorniNick[dataString];
                const haImpegni = impegni.some(i => i.data === dataString);

                let classi = 'calendar-cell';
                if (isNick) classi += ' nick-day';
                if (isOggi) classi += ' is-today';
                if (isSelezionato) classi += ' selected';

                cella.className = classi;
                cella.innerHTML = `<span>${giorno}</span>${haImpegni ? '<span class="event-dot"></span>' : ''}`;
                
                cella.onclick = () => {
                    document.getElementById('inputData').value = dataString;
                    sincronizzaDataSelezionata(dataString);
                };

                griglia.appendChild(cella);
            }

            // 3. Giorni Mese Successivo
            const totaleCelleInserite = giornoInizio + ultimoGiornoMese;
            const celleRimanenti = (totaleCelleInserite > 35 ? 42 : 35) - totaleCelleInserite;

            for (let i = 1; i <= celleRimanenti; i++) {
                const cella = document.createElement('div');
                cella.className = 'calendar-cell other-month';
                cella.innerText = i;
                griglia.appendChild(cella);
            }
        }

        async function salvaImpegno(e) {
            e.preventDefault();
            const idModifica = document.getElementById('inputIdModifica').value;
            const id = idModifica || Date.now().toString();

            const datiImpegno = {
                data: document.getElementById('inputData').value,
                titolo: document.getElementById('inputTitolo').value.trim(),
                ora: document.getElementById('inputOra').value || '',
                categoria: document.getElementById('inputCategoria').value,
                note: document.getElementById('inputNote').value.trim() || '',
                completato: false
            };

            try {
                await db.collection("impegni").doc(id).set(datiImpegno, { merge: true });
                if (idModifica) {
                    annullaModifica();
                } else {
                    document.getElementById('inputTitolo').value = '';
                    document.getElementById('inputOra').value = '';
                    document.getElementById('inputNote').value = '';
                }
            } catch (err) {
                console.error("Errore durante il salvataggio:", err);
            }
        }

        function preparaModifica(id) {
            const impegno = impegni.find(i => i.id === id);
            if (!impegno) return;
            document.getElementById('inputIdModifica').value = impegno.id;
            document.getElementById('inputData').value = impegno.data;
            document.getElementById('inputTitolo').value = impegno.titolo;
            document.getElementById('inputOra').value = impegno.ora || '';
            document.getElementById('inputCategoria').value = impegno.categoria;
            document.getElementById('inputNote').value = impegno.note || '';
            
            document.getElementById('formTitoloSezione').innerHTML = "📝 Modifica Impegno";
            document.getElementById('btnSubmitForm').innerText = "Aggiorna Impegno";
            document.getElementById('btnAnnullaModifica').classList.remove('d-none');
            sincronizzaDataSelezionata(impegno.data);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function annullaModifica() {
            document.getElementById('inputIdModifica').value = '';
            document.getElementById('formImpegno').reset();
            document.getElementById('inputData').value = giornoSelezionato;
            document.getElementById('formTitoloSezione').innerHTML = "✏️ Aggiungi Impegno";
            document.getElementById('btnSubmitForm').innerText = "Salva Impegno";
            document.getElementById('btnAnnullaModifica').classList.add('d-none');
            sincronizzaDataSelezionata(giornoSelezionato);
        }

        async function eliminaImpegno(id) {
            try {
                await db.collection("impegni").doc(id).delete();
            } catch (err) {
                console.error("Errore durante l'eliminazione:", err);
            }
        }

        async function toggleCompletato(id) {
            const impegno = impegni.find(i => i.id === id);
            if (impegno) {
                try {
                    await db.collection("impegni").doc(id).set({ completato: !impegno.completato }, { merge: true });
                } catch (err) {
                    console.error("Errore stato completamento:", err);
                }
            }
        }

        function mostraImpegniGiorno(dataStr) {
            const container = document.getElementById('listaImpegniContainer');
            const titoloGiorno = document.getElementById('titoloListaGiorno');
            const sottotitolo = document.getElementById('sottotitoloGiorno');
            const badge = document.getElementById('badgeConteggio');

            const [anno, mese, giorno] = dataStr.split('-');
            const isNick = !!giorniNick[dataStr];

            titoloGiorno.innerText = `Impegni del ${giorno}/${mese}/${anno}`;
            
            const dataObj = new Date(anno, mese - 1, giorno);
            const nomiGiorniEstesi = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
            sottotitolo.innerText = `${nomiGiorniEstesi[dataObj.getDay()]} ${isNick ? '• 🌟 Nick' : ''}`;

            const impegniGiorno = impegni
                .filter(i => i.data === dataStr)
                .sort((a, b) => (a.ora || '23:59').localeCompare(b.ora || '23:59'));

            badge.innerText = `${impegniGiorno.length} ${impegniGiorno.length === 1 ? 'impegno' : 'impegni'}`;
            container.innerHTML = '';

            if (impegniGiorno.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5 text-muted my-auto">
                        <div class="fs-2 mb-2">📋</div>
                        <p class="fw-semibold small mb-1">Nessun impegno in programma per questa data.</p>
                        <p class="small text-muted mb-0">Usa il modulo a sinistra per aggiungere una nuova attività.</p>
                    </div>
                `;
                return;
            }

            impegniGiorno.forEach(item => {
                const badgeStyle = classiCategorie[item.categoria] || 'bg-light text-dark border';
                const card = document.createElement('div');
                card.className = `p-3 rounded-3 border bg-white d-flex align-items-start justify-content-between gap-3 ${item.completato ? 'opacity-50 text-decoration-line-through' : ''}`;
                
                card.innerHTML = `
                    <div class="d-flex align-items-start gap-3 flex-grow-1 min-w-0">
                        <input type="checkbox" ${item.completato ? 'checked' : ''} onchange="toggleCompletato('${item.id}')" class="form-check-input mt-1 cursor-pointer">
                        <div class="flex-grow-1 min-w-0">
                            <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                                <span class="fw-bold small text-dark">${item.titolo}</span>
                                <span class="badge border small ${badgeStyle}">${item.categoria}</span>
                                ${item.ora ? `<span class="badge bg-light text-secondary border small">🕒 ${item.ora}</span>` : ''}
                            </div>
                            ${item.note ? `<p class="text-muted small mb-0 text-break">${item.note}</p>` : ''}
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-1 no-print">
                        <button onclick="preparaModifica('${item.id}')" class="btn btn-sm btn-light border-0 text-secondary px-2" title="Modifica">✏️</button>
                        <button onclick="eliminaImpegno('${item.id}')" class="btn btn-sm btn-light border-0 text-danger px-2" title="Elimina">🗑️</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        /* FUNZIONE DOWNLOAD FILE APP HTML */
        function scaricaFileApp() {
            const contenutoHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            const blob = new Blob([contenutoHtml], { type: 'text/html;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'agenda.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        /* FUNZIONI DI STAMPA REPORT */
        function stampaSettimana() {
            const dataRif = new Date(giornoSelezionato);
            const giornoSettimana = dataRif.getDay();
            const diffAlLunedì = dataRif.getDate() - giornoSettimana + (giornoSettimana === 0 ? -6 : 1);
            
            const lunedi = new Date(dataRif);
            lunedi.setDate(diffAlLunedì);
            const domenica = new Date(lunedi);
            domenica.setDate(lunedi.getDate() + 6);

            const startStr = formattaDataISO(lunedi);
            const endStr = formattaDataISO(domenica);

            const filtrati = impegni
                .filter(i => i.data >= startStr && i.data <= endStr)
                .sort((a, b) => a.data.localeCompare(b.data) || (a.ora || '').localeCompare(b.ora || ''));

            generaFinestraStampa(`Report Settimanale (${formattaDataIt(startStr)} - ${formattaDataIt(endStr)})`, filtrati);
        }

        function stampaMese() {
            const [anno, mese, _] = giornoSelezionato.split('-');
            const filtrati = impegni
                .filter(i => i.data.startsWith(`${anno}-${mese}`))
                .sort((a, b) => a.data.localeCompare(b.data) || (a.ora || '').localeCompare(b.ora || ''));

            const nomiMesi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
            generaFinestraStampa(`Report Mensile (${nomiMesi[parseInt(mese)-1]} ${anno})`, filtrati);
        }

        function generaFinestraStampa(titoloReport, listaImpegni) {
            let finestra = window.open('', '_blank');
            let html = `
                <!DOCTYPE html>
                <html lang="it">
                <head>
                    <meta charset="UTF-8">
                    <title>${titoloReport}</title>
                    <style>
                        body { font-family: system-ui, sans-serif; padding: 24px; color: #0f172a; }
                        h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
                        p.sub { color: #64748b; font-size: 12px; margin-bottom: 20px; }
                        table { width: 100%; border-collapse: collapse; font-size: 13px; }
                        th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
                        th { background-color: #f8fafc; font-weight: 700; text-transform: uppercase; font-size: 11px; }
                        .nick-mark { color: #d97706; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <h1>${titoloReport}</h1>
                    <p class="sub">Agenda Personale Sincronizzata</p>
            `;

            if (listaImpegni.length === 0) {
                html += `<p>Nessun impegno trovato per il periodo selezionato.</p>`;
            } else {
                html += `
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 25%;">Data</th>
                                <th style="width: 10%;">Ora</th>
                                <th style="width: 15%;">Categoria</th>
                                <th style="width: 25%;">Attività</th>
                                <th style="width: 25%;">Note</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                listaImpegni.forEach(i => {
                    const [a, m, g] = i.data.split('-');
                    const d = new Date(a, m - 1, g);
                    const giorniSettimanaNomi = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
                    const haNick = !!giorniNick[i.data];

                    html += `
                        <tr>
                            <td><b>${giorniSettimanaNomi[d.getDay()]} ${formattaDataIt(i.data)}</b> ${haNick ? '<span class="nick-mark">★</span>' : ''}</td>
                            <td>${i.ora || '-'}</td>
                            <td><b>${i.categoria}</b></td>
                            <td>${i.titolo} ${i.completato ? '(Completato)' : ''}</td>
                            <td>${i.note || '-'}</td>
                        </tr>
                    `;
                });
                html += `</tbody></table>`;
            }

            html += `</body></html>`;

            finestra.document.write(html);
            finestra.document.close();
            setTimeout(() => { finestra.print(); }, 250);
        }

        // Inizializzazione pagina
        window.onload = () => {
            document.getElementById('inputData').value = giornoSelezionato;
            renderizzaCalendario();
        };
    </script>
</body>
</html>
