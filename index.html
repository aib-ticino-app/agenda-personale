<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Personale Sincronizzata</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts Inter -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        @media print {
            body {
                background: white !important;
                color: black !important;
                font-size: 11pt;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .print-grid {
                display: grid !important;
                grid-template-columns: repeat(7, 1fr) !important;
                gap: 4px !important;
                width: 100% !important;
            }
            .print-day-cell {
                border: 1pt solid #cbd5e1 !important;
                min-height: 110px !important;
                padding: 4px !important;
                background: white !important;
            }
            .print-header {
                text-align: center;
                margin-bottom: 12px;
                border-bottom: 2pt solid #0284c7;
                padding-bottom: 8px;
            }
        }
        .print-only {
            display: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center font-bold text-xl shadow-md">
                    <i class="fa-solid fa-calendar-check"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 leading-tight">Agenda Personale</h1>
                    <p class="text-xs text-slate-500 font-medium">Sincronizzata in Tempo Reale</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="btnNickToggle" onclick="toggleNickFilter()" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center space-x-2 bg-slate-100 text-slate-700 hover:bg-slate-200">
                    <i class="fa-solid fa-user-tag text-slate-500"></i>
                    <span id="nickToggleLabel">Tutti i giorni</span>
                </button>
                <button onclick="openPrintModal()" class="px-3 py-1.5 rounded-lg text-sm font-semibold transition bg-brand-50 text-brand-700 hover:bg-brand-100 flex items-center space-x-1.5 border border-brand-200">
                    <i class="fa-solid fa-print"></i>
                    <span class="hidden sm:inline">Stampa</span>
                </button>
            </div>
        </div>
    </header>
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 no-print">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-2 w-full md:w-auto justify-between md:justify-start">
                <button onclick="changeMonth(-1)" class="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 transition">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="text-center min-w-[200px]">
                    <h2 id="currentMonthYear" class="text-xl font-bold text-slate-800 capitalize"></h2>
                    <span id="monthWeekRange" class="text-xs font-semibold text-brand-600"></span>
                </div>
                <button onclick="changeMonth(1)" class="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-600 transition">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button onclick="goToToday()" class="ml-2 px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
                    Oggi
                </button>
            </div>
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <button onclick="openAddModal()" class="w-full md:w-auto px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold shadow-md transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuovo Impegno</span>
                </button>
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="grid grid-cols-8 bg-slate-50 border-b border-slate-200 text-center font-bold text-xs uppercase tracking-wider text-slate-500 py-3">
                <div class="text-brand-600">Sett.</div>
                <div>Lunedì</div>
                <div>Martedì</div>
                <div>Mercoledì</div>
                <div>Giovedì</div>
                <div>Venerdì</div>
                <div class="text-amber-600">Sabato</div>
                <div class="text-rose-600">Domenica</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-8 auto-rows-fr divide-x divide-y divide-slate-100 bg-slate-200">
            </div>
        </div>
    </main>
    <div id="eventModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Nuovo Impegno</h3>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="eventForm" onsubmit="saveEvent(event)">
                <input type="hidden" id="eventId">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Data</label>
                        <input type="date" id="eventDate" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Titolo / Descrizione</label>
                        <input type="text" id="eventTitle" placeholder="Es. Visita medica" required class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Orario (Opzionale)</label>
                        <input type="time" id="eventTime" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div class="p-3 bg-indigo-50 border border-indigo-100 rounded-xl flex items-center space-x-3">
                        <input type="checkbox" id="eventDayNick" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                        <label for="eventDayNick" class="text-sm font-semibold text-indigo-900 flex items-center space-x-1.5 cursor-pointer">
                            <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 inline-block"></span>
                            <span>Presenza di Nick per questo giorno</span>
                        </label>
                    </div>
                </div>
                <div class="mt-6 flex justify-between items-center space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" id="btnDeleteEvent" onclick="deleteCurrentEvent()" class="px-4 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-xl font-semibold text-sm transition hidden">
                        <i class="fa-solid fa-trash mr-1"></i> Elimina
                    </button>
                    <div class="flex space-x-2 ml-auto">
